[package]
name = "capri-desktop"
version = "1.0.0"
edition = "2021"
authors = ["lachydotmcg", "leoiburn"]
description = "Native Linux Capri Desktop Mascot & Ollama AI Construct"
license = "MIT"

[[bin]]
name = "capri"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
minifb = { version = "0.27", default-features = false, features = ["x11"] }
x11-dl = "2.21"
fontdue = "0.9"
ureq = { version = "2.9", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fastrand = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
